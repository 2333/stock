<script type="text/javascript">
    const nameParam = $.getUrlVar('table_name');
let dateParam = "{{ date_now }}";
const colInfos = {% raw web_module_data.column_names %};

function oaDateToString(oaDate) {
    if (!oaDate) return '';
    // OADate to JS Date
    const date = new Date(Math.round((oaDate - 25569) * 86400 * 1000));
    return date.toISOString().slice(0, 10); // yyyy-mm-dd
}

function getColumnDefs(colInfos) {
    return colInfos.map(col => {
        let def = {
            headerName: col.header || col.value,
            field: col.value,
            sortable: true,
            filter: col.value.includes('date') ? 'agDateColumnFilter' : 'agTextColumnFilter',
            resizable: true
        };
        if (col.value === 'code') {
            def.cellRenderer = params => `<a href="/instock/data/indicators?code=${params.value}&date=${params.data.listing_date}&name=${params.data.name}" target="_blank">${params.value}</a>`;
        }
        if (col.value.includes('date')) {
            def.valueFormatter = params => oaDateToString(params.value);
        }
        return def;
    });
}

function fetchTableData() {
    return $.getJSON(`/instock/api_data?name=${nameParam}&date=${dateParam}`);
}

$(document).ready(function () {
    fetchTableData().then(data => {
        const gridOptions = {
            columnDefs: getColumnDefs(colInfos),
            rowData: data,
            defaultColDef: { filter: true, sortable: true, floatingFilter: true },
            onFilterChanged: updateStatusBar,
            onSortChanged: updateStatusBar,
            onRowSelected: updateStatusBar,
            pagination: true,
            paginationPageSize: 100
        };
        const gridDiv = document.getElementById('instock-data');
        const grid = agGrid.createGrid(gridDiv, gridOptions);

        // Excel 导出
        $('#saveExcel').click(function () {
            grid.api.exportDataAsCsv({ fileName: nameParam + dateParam + ".csv" });
        });

        // 重置筛选
        $('#resetFilter').click(function () {
            grid.api.setFilterModel(null);
        });

        // 日期选择
        $('.date-picker').datepicker({
            language: 'zh-CN',
            format: "yyyy-mm-dd",
            autoclose: true,
            todayHighlight: true
        }).on('changeDate', function (ev) {
            dateParam = $('#dateid').val();
            fetchTableData().then(newData => {
                grid.api.setRowData(newData);
                updateStatusBar();
            });
        });

        // 状态栏
        function updateStatusBar() {
    if (!grid.api) return;
    const total = grid.api.getDisplayedRowCount();
    const allRows = grid.api.getModel().rowsToDisplay.length;
    $('#statusBar').html(`<span>总记录/筛选记录：<b>${allRows}</b> / <b>${total}</b> 条</span>`);
}
        updateStatusBar();
    });
});
</script>
