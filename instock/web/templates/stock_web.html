{% extends "layout/default.html" %}

{% block main_content %}
<link rel="stylesheet" href="/static/css/bootstrap-datepicker3.min.css" />
<link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
<script src="/static/js/FileSaver.js" type="text/javascript"></script>
<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js" type="text/javascript"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="/static/js/bootstrap-datepicker.min.js"></script>
<script src="/static/js/bootstrap-datepicker.zh-CN.min.js"></script>

<div style="height:100%;display:flex;flex-direction:column;overflow:hidden;">
  <div class="table-header" style="width:100%;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;font-size:14px;">
      <span style="white-space:nowrap;margin-right:8px;">{{ web_module_data.name }} 日期：</span>
      <input type="hidden" id="dateid_old">
      <input type="text" value="{{ date_now }}" id="dateid" class="input-group-sm form-control date-picker" style="width:130px;">
    </div>
    <div style="display:flex;gap:6px;">
      <input type="button" id="resetFilter" value="重置筛选" class="btn-small">
      <input type="button" id="saveExcel" value="保存Excel" class="btn-small">
      <input type="button" id="clearCache" value="清除缓存" class="btn-small btn-danger">
    </div>
  </div>

  <div id="instock-data-wrapper" style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;">
    <div id="instock-data" style="flex:1 1 auto;min-height:0;"></div>
    <div id="pager" style="flex:0 0 auto;padding:4px 6px;border-top:1px solid #ddd;background:#fafafa;"></div>
    <div id="statusBar" style="flex:0 0 auto;height:22px;"></div>
  </div>
</div>

<script type="text/javascript">
  // ================== 可调配置 ==================
  const DEFAULT_FROZEN_COUNT = 2;
  const forceTextFields = [];
  const forceNumberFields = [];

  // ================== 全局变量 ==================
  const nameParam = $.getUrlVar('table_name');
  let dateParam = "{{ date_now }}";
  const colInfos = {% raw web_module_data.column_names %};
  let table = null;
  let dateFieldsInColumns = [];
  const LOG_PREFIX = "[InstockTable]";
  let building = false;

  // ================== 日期解析与格式化 ==================
  function parseOADateString(dateStr) {
    if (!dateStr || typeof dateStr !== 'string') return null;
    const match = dateStr.match(/\/OADate\((\d+(?:\.\d+)?)\)\//i);
    if (!match) return null;
    const oa = parseFloat(match[1]);
    if (isNaN(oa)) return null;
    return new Date((oa - 25569) * 86400 * 1000);
  }
  function parseDateFlexible(val) {
    if (val === null || val === undefined || val === '') return null;
    if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
      const d = new Date(val); return isNaN(d.getTime()) ? null : d;
    }
    if (typeof val === 'string' && val.includes('/OADate(')) return parseOADateString(val);
    if (typeof val === 'number') {
      if (val > 10000 && val < 60000) return new Date((val - 25569) * 86400 * 1000);
      if (val > 100000000000 && val < 5000000000000) {
        const d = new Date(val); return isNaN(d.getTime()) ? null : d;
      }
    }
    if (typeof val === 'string') {
      const d = new Date(val); return isNaN(d.getTime()) ? null : d;
    }
    return null;
  }
  function formatDateISO(d) {
    if (!(d instanceof Date) || isNaN(d.getTime())) return '';
    return d.toISOString().slice(0,10);
  }
  function dateValueToDisplay(val) {
    const d = parseDateFlexible(val);
    return d ? formatDateISO(d) : '';
  }

  // ================== 数值判断与格式化 ==================
  const NF2 = new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const NF4 = new Intl.NumberFormat('zh-CN',{minimumFractionDigits:4,maximumFractionDigits:4});
  const NF0 = new Intl.NumberFormat('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0});
  function isPureNumeric(val) {
    if (typeof val === 'number') return isFinite(val);
    if (typeof val === 'string') {
      const t = val.trim();
      return /^[+-]?\d+(\.\d+)?$/.test(t);
    }
    return false;
  }
  function formatNumberFlexible(num) {
    if (!isPureNumeric(num)) return num;
    const v = parseFloat(num);
    if (Math.abs(v) < 0.01 && v !== 0) return NF4.format(v);
    if (Math.abs(v) >= 10000) return NF0.format(v);
    return NF2.format(v);
  }
  function percentFormatter(cell) {
    const val = cell.getValue();
    if (!isPureNumeric(val)) return val ?? '';
    const num = parseFloat(val);
    //get col name
    const field = cell.getColumn().getField();
    const needpercent = field.toLowerCase().includes('rate')
    let decimal = 2;
    if (Math.abs(num) < 0.1) decimal = 3;
    else if (Math.abs(num) >= 100) decimal = 1;
    const txt = num.toFixed(decimal) + '%';
    const color = num > 0 ? 'color:red;' : (num < 0 ? 'color:green;' : '');
    return `<span style="${color}">${txt}</span>`;
  }
  function numberFormatter(cell) {
    const val = cell.getValue();
    if (!isPureNumeric(val)) return val ?? '';
    return formatNumberFlexible(val);
  }

  // ================== 字段类型判断 ==================
  function shouldFormatAsPercent(field) {
    if (forceTextFields.includes(field)) return false;
    const lower = field.toLowerCase();
    const list = ['ratio','percent','rate','change_ratio'];
    return list.some(k => lower.includes(k));
  }
  function shouldFormatAsNumber(field) {
    if (forceTextFields.includes(field)) return false;
    if (forceNumberFields.includes(field)) return true;
    const lower = field.toLowerCase();
    const list = ['price','amount','value','ratio','percent','rate','change','volume','turnover','market_cap','pe','pb'];
    return list.some(k => lower.includes(k));
  }
  function getColumnWidth(field) {
    if (field === 'code') return 90;
    if (field === 'name') return 120;
    if (field.toLowerCase().includes('date')) return 110;
    if (field.toLowerCase().includes('ratio') || field.toLowerCase().includes('percent')) return 90;
    if (field.toLowerCase().includes('price') || field.toLowerCase().includes('amount')) return 100;
    return 110;
  }

  // ================== 冻结列存储 ==================
  function storageKeyFrozen() { return "frozenColumns_" + nameParam; }
  function storageKeyLayout() { return "tableLayout_" + nameParam; }
  function getStoredFrozen() {
    try { return JSON.parse(localStorage.getItem(storageKeyFrozen()) || "[]"); }
    catch(e){ return []; }
  }
  function storeFrozen(list) {
    try { localStorage.setItem(storageKeyFrozen(), JSON.stringify(list)); }
    catch(e){ console.warn(LOG_PREFIX, "保存冻结列表失败", e); }
  }
  function normalizeFrozenList(currentFields) {
    let stored = getStoredFrozen().filter(f => currentFields.includes(f));
    if (stored.length < DEFAULT_FROZEN_COUNT) {
      currentFields.slice(0, DEFAULT_FROZEN_COUNT).forEach(f=>{
        if (!stored.includes(f)) stored.push(f);
      });
      storeFrozen(stored);
    }
    return stored;
  }
  function applyFrozenColumns() {
    if (!table) return;
    const cols = table.getColumns();
    const fields = cols.map(c => c.getField());
    const targetFrozen = normalizeFrozenList(fields);
    cols.forEach(c=>{
      const field = c.getField();
      if (!field) return;
      const should = targetFrozen.includes(field);
      const cur = !!c.getDefinition().frozen;
      if (cur === should) return;
      if (should) {
        if (typeof c.freeze === 'function') c.freeze(); else c.updateDefinition({frozen:true});
      } else {
        if (typeof c.unfreeze === 'function') c.unfreeze(); else c.updateDefinition({frozen:false});
      }
    });
    console.log(LOG_PREFIX,"冻结列已应用：", targetFrozen);
  }
  function toggleColumnFrozen(column) {
    const field = column.getField();
    if (!field) return;
    const allFields = table.getColumns().map(c=>c.getField());
    let stored = getStoredFrozen().filter(f=>allFields.includes(f));
    const isFrozen = !!column.getDefinition().frozen;
    if (isFrozen) {
      if (typeof column.unfreeze === 'function') column.unfreeze(); else column.updateDefinition({frozen:false});
      stored = stored.filter(f => f !== field);
    } else {
      if (typeof column.freeze === 'function') column.freeze(); else column.updateDefinition({frozen:true});
      if (!stored.includes(field)) stored.push(field);
    }
    storeFrozen(stored);
    console.log(LOG_PREFIX,"切换冻结:", field, "=>", !isFrozen, "当前：", stored);
  }

  // ================== 构建列定义 ==================
  function buildColumns(colInfos) {
    let frozenStored = getStoredFrozen();
    const isMobile = window.innerWidth < 768;
    if (isMobile && frozenStored.length > DEFAULT_FROZEN_COUNT) {
      frozenStored = frozenStored.slice(0, DEFAULT_FROZEN_COUNT);
      storeFrozen(frozenStored);
    }
    const defs = [];
    colInfos.forEach((c, idx)=>{
      const title = c.caption || c.header || c.title || c.name || c.value || c.field || ('COL_' + idx);
      const field = c.value || c.field || c.name;
      if (!field) { console.warn(LOG_PREFIX,"缺失 field:", c); return; }
      const lower = field.toLowerCase();
      let frozenFlag;
      if (frozenStored.length === 0) frozenFlag = idx < DEFAULT_FROZEN_COUNT;
      else frozenFlag = frozenStored.includes(field);

      const def = {
        title,
          field,
        headerFilter:true,
        sorter: lower.includes('date') ? "string" :
                (shouldFormatAsNumber(field) || shouldFormatAsPercent(field) ? "number" : "string"),
        resizable:true,
        width:getColumnWidth(field),
        minWidth:60,
        frozen:frozenFlag,
        headerContextMenu:[{
          label:"冻结/解冻此列",
          action:(e,column)=>toggleColumnFrozen(column)
        }]
      };

      if (field === 'code') {
        def.formatter = cell => {
          const value = cell.getValue();
          if (!value) return '';
          const data = cell.getRow().getData();
          let dt = dateParam;
          if (data.listing_date) {
            const ds = dateValueToDisplay(data.listing_date);
            if (ds) dt = ds;
          }
          const nm = data.name || '';
          return `<a href="/instock/data/indicators?code=${value}&date=${dt}&name=${nm}" target="_blank">${value}</a>`;
        };
      } else if (lower.includes('date')) {
        def.formatter = cell => dateValueToDisplay(cell.getValue());
        def.headerFilter = "input";
        def.frozen = false;
      } else if (shouldFormatAsPercent(field)) {
        def.formatter = percentFormatter;
        def.sorter = "number";
      } else if (shouldFormatAsNumber(field)) {
        def.formatter = numberFormatter;
        def.sorter = "number";
      }
      defs.push(def);
    });

    const dateCols = [], otherCols = [];
    defs.forEach(d=>{
      if (d.field && d.field.toLowerCase().includes('date')) dateCols.push(d); else otherCols.push(d);
    });
    dateFieldsInColumns = dateCols.map(d=>d.field);
    return [...otherCols, ...dateCols];
  }

  // ================== 数据获取 ==================
  function fetchTableData() {
    return $.getJSON(`/instock/api_data?name=${nameParam}&date=${dateParam}`);
  }
  function preprocessData(data) {
    if (!Array.isArray(data)) return [];
    return data.map(r=>({...r}));
  }

  // ================== 状态栏 ==================
  function updateStatusBar() {
    if (!table) return;
    try {
      const total = table.getDataCount();
      const filtered = table.getDataCount("active");
      const sel = table.getSelectedRows();
      const pos = sel && sel.length ? sel[0].getPosition(true) : 0;
      $('#statusBar').html(`<span style="font-size:12px;">总记录/筛选：<b>${total}</b>/<b>${filtered}</b> 当前行：<b>${pos}</b></span>`);
    } catch(e){ console.warn(LOG_PREFIX,"状态栏更新失败", e); }
  }

  // ================== 日期列显隐 ==================
  function hideDateColumnsIfEmpty(data) {
    if (!table) return;
    dateFieldsInColumns.forEach(f=>{
      const col = table.getColumn(f);
      if (!col) return;
      let hasVal = false;
      if (Array.isArray(data)) {
        for (let i=0;i<data.length;i++){
          if (dateValueToDisplay(data[i][f])) { hasVal = true; break; }
        }
      }
      if (hasVal) col.show(); else col.hide();
    });
  }
  function logMissingDateFields(data) {
    if (!data || !data.length) return;
    const first = data[0];
    dateFieldsInColumns.forEach(f=>{
      if (!(f in first)) console.warn(LOG_PREFIX,"日期字段列存在但数据缺失:", f);
    });
  }

  // ================== 初始化表格 ==================
  function initTable(data) {
    building = true;
    const columns = buildColumns(colInfos);
    const pagerElement = document.getElementById('pager');
    if (!pagerElement || typeof pagerElement.appendChild !== 'function') {
      console.warn(LOG_PREFIX, "未找到有效分页容器 pager，将使用内置默认 footer。");
    }

    const tableOptions = {
      data,
      columns,
      layout:"fitColumns",
      layoutColumnsOnNewData:false,
      pagination:true,
      paginationMode:"local",
      paginationSize:50,
      paginationSizeSelector:[50,100,200,500],
      movableColumns:true,
      reactiveData:false,
      height:"100%",
      selectable:1,
      headerSortClickElement:"header",
      dataFiltered:updateStatusBar,
      dataSorted:updateStatusBar,
      rowSelected:updateStatusBar,
      rowDeselected:updateStatusBar,
      dataLoaded:updateStatusBar,
      columnResized:()=>{
        try {
          localStorage.setItem(storageKeyLayout(), JSON.stringify(table.getColumnLayout()));
        } catch(e){ console.warn(LOG_PREFIX,"保存布局失败", e); }
      },
      tableBuilt:()=>{
        console.log(LOG_PREFIX,"表格构建完成");
        try {
          const saved = localStorage.getItem(storageKeyLayout());
          if (saved) table.setColumnLayout(JSON.parse(saved));
        } catch(e){ console.warn(LOG_PREFIX,"恢复列布局失败", e); }
        applyFrozenColumns();
          hideDateColumnsIfEmpty(data);
        logMissingDateFields(data);
        updateStatusBar();
        building = false;
      }
    };

    // 仅当 pagerElement 存在且是 DOM，才传入
    if (pagerElement && typeof pagerElement.appendChild === 'function') {
      tableOptions.paginationElement = pagerElement;
    }

    table = new Tabulator("#instock-data", tableOptions);

    // 行右键菜单
    table.on("rowContext", (e,row)=>{
      e.preventDefault();
      const menu = document.createElement("div");
      menu.className = "custom-context-menu";
      Object.assign(menu.style,{
        position:"absolute",left:e.pageX+"px",top:e.pageY+"px",
        background:"#fff",border:"1px solid #ddd",
        boxShadow:"2px 2px 8px rgba(0,0,0,0.15)",padding:"4px 0",
        zIndex:1000,borderRadius:"4px",minWidth:"140px",fontSize:"13px"
      });
      function addItem(label,fn){
        const div=document.createElement("div");
        div.textContent=label;
        div.style.cssText="padding:5px 14px;cursor:pointer;";
        div.onmouseover=()=>div.style.background="#f5f5f5";
        div.onmouseout=()=>div.style.background="";
        div.onclick=()=>{ fn(); close(); };
        menu.appendChild(div);
      }
      addItem("复制行数据", ()=>{
        const d=row.getData();
        const text = Object.entries(d).map(([k,v])=>{
          if (k.toLowerCase().includes('date')) return `${k}: ${dateValueToDisplay(v)}`;
          if (shouldFormatAsNumber(k) && isPureNumeric(v)) return `${k}: ${formatNumberFlexible(v)}`;
          return `${k}: ${v}`;
        }).join("\n");
        navigator.clipboard.writeText(text).then(()=> console.log(LOG_PREFIX,"行已复制"));
      });
      document.body.appendChild(menu);
      function close(){
        if(menu && menu.parentNode) menu.parentNode.removeChild(menu);
        document.removeEventListener("click",close);
      }
      setTimeout(()=>document.addEventListener("click",close),0);
    });
  }

  // ================== 加载数据 ==================
  function loadInitialData() {
    fetchTableData().then(raw=>{
      if (Array.isArray(raw) && raw.length) console.log(LOG_PREFIX,"示例数据:", raw[0]);
      else console.warn(LOG_PREFIX,"数据为空或非数组");
      const data = preprocessData(raw);
      initTable(data);
    }).catch(err=>{
      console.error(LOG_PREFIX,"加载失败",err);
      $('#instock-data').html('<div class="alert alert-danger">加载数据失败</div>');
    });
  }
  function reloadDataAfterDateChange() {
    fetchTableData().then(raw=>{
      const data = preprocessData(raw);
      if (table) {
        table.replaceData(data).then(()=>{
          hideDateColumnsIfEmpty(data);
          logMissingDateFields(data);
          updateStatusBar();
        });
      }
    }).catch(err=> console.error(LOG_PREFIX,"日期切换加载失败",err));
  }

  // ================== 事件 ==================
  $(document).ready(function(){
    if (typeof Tabulator === 'undefined') {
      console.error(LOG_PREFIX,"Tabulator 未加载");
      $('#instock-data').html('<div class="alert alert-danger">表格组件加载失败</div>');
      return;
    }
    console.log(LOG_PREFIX,"Tabulator 版本:", Tabulator.version);

    $('.date-picker').datepicker({
      language:'zh-CN',format:"yyyy-mm-dd",autoclose:true,todayHighlight:true
    }).on('changeDate', function(){
      const newDate = $('#dateid').val();
      if (newDate && dateParam !== newDate) {
        const old = $('#dateid_old').val();
        if (old === newDate) return;
        dateParam = newDate;
        $('#dateid_old').val(newDate);
        reloadDataAfterDateChange();
      }
    });

    $('#saveExcel').on('click', ()=>{
      if (table) table.download("xlsx", `${nameParam}_${dateParam}.xlsx`, {sheetName:nameParam});
    });
    $('#resetFilter').on('click', ()=>{ if (table) table.clearHeaderFilter(); });
    $('#clearCache').on('click', ()=>{
      localStorage.removeItem(storageKeyFrozen());
      localStorage.removeItem(storageKeyLayout());
      alert('已清除冻结与布局缓存，刷新后生效');
    });

    loadInitialData();
  });
</script>

<style>

    background:#307ECC;
    border:1px solid #286bb5;
    color:#fff;
    padding:4px 10px;
    font-size:12px;

  .tabulator-cell[tabulator-field*="rate"],
  .tabulator-cell[tabulator-field*="change"],
  .tabulator-cell[tabulator-field*="volume"],

  #pager .tabulator-page-size { font-size:12px; }

</style>
{% end %}
